name: Deploy Core

on:
  push:
    branches:
      - main
    paths:
      - 'apps/core/**'
      - 'packages/db/**'
      - 'packages/queues/**'
      - 'packages/utils/**'
      - 'Dockerfile'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-core.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Core
    runs-on: ubuntu-latest
    env:
      AWS_INSTANCE_SG_ID: ${{ secrets.SECURITY_GROUP_ID }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_CORE }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_CORE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get IP Addresses
        id: ip
        uses: candidob/get-runner-ip@v1.0.0

      - name: Whitelist runner ip address
        id: whitelist-ip
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id $AWS_INSTANCE_SG_ID \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4}}/32

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push Image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: unext-backend-ecr
          IMAGE_TAG: ${{ github.sha }}
          GIT_SECRET_PRIVATE_KEY: ${{ secrets.GIT_SECRET_PRIVATE_KEY }}
          GIT_SECRET_PASSWORD: ${{ secrets.GIT_SECRET_PASSWORD }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
          --build-arg GIT_SECRET_PRIVATE_KEY="$GIT_SECRET_PRIVATE_KEY" \
          --build-arg GIT_SECRET_PASSWORD="$GIT_SECRET_PASSWORD" \
          --no-cache --progress=plain .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Deploy and start container
        id: deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOSTNAME }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SECRET_SSH_KEY }}
          script: |
            # Record the image currently running so the rollback step can restore it
            mkdir -p "$HOME/.unext-backend"
            PREVIOUS_IMAGE=$(docker inspect --format '{{.Config.Image}}' unext-backend 2>/dev/null || true)
            if [ -n "$PREVIOUS_IMAGE" ] && [ "$PREVIOUS_IMAGE" != "${{ secrets.ECR_REGISTRY }}/unext-backend-ecr:${{ github.sha }}" ]; then
              echo "$PREVIOUS_IMAGE" > "$HOME/.unext-backend/previous-image"
              echo "Previous image recorded: $PREVIOUS_IMAGE"
            fi

            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker pull ${{ secrets.ECR_REGISTRY }}/unext-backend-ecr:${{ github.sha }}
            docker stop unext-backend
            docker rm unext-backend
            docker run --restart unless-stopped -d --name unext-backend -p ${{ secrets.PORT }}:${{ secrets.PORT }} ${{ secrets.ECR_REGISTRY }}/unext-backend-ecr:${{ github.sha }}

      - name: Health check
        id: health-check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOSTNAME }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SECRET_SSH_KEY }}
          script: |
            TIMEOUT=60
            START=$(date +%s)
            until curl -fs --max-time 5 "http://localhost:${{ secrets.PORT }}/health" > /dev/null; do
              ELAPSED=$(( $(date +%s) - START ))
              if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
                echo "App did not become healthy within ${TIMEOUT}s"
                exit 1
              fi
              echo "Waiting for app... (${ELAPSED}s)"
              sleep 5
            done
            echo "App is healthy after $(( $(date +%s) - START ))s"

      - name: Rollback to previous version
        if: ${{ failure() && (steps.deploy.outcome == 'failure' || steps.health-check.outcome == 'failure') }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOSTNAME }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SECRET_SSH_KEY }}
          script: |
            set -e
            PREVIOUS_FILE="$HOME/.unext-backend/previous-image"
            if [ ! -s "$PREVIOUS_FILE" ]; then
              echo "No previous image recorded, cannot roll back"
              exit 1
            fi
            PREVIOUS_IMAGE=$(cat "$PREVIOUS_FILE")

            RUNNING_IMAGE=$(docker inspect --format '{{.Config.Image}}' unext-backend 2>/dev/null || true)
            RUNNING_STATE=$(docker inspect --format '{{.State.Running}}' unext-backend 2>/dev/null || true)
            if [ "$RUNNING_IMAGE" = "$PREVIOUS_IMAGE" ] && [ "$RUNNING_STATE" = "true" ]; then
              echo "Previous image is still running, nothing to roll back"
              exit 0
            fi

            echo "Rolling back to $PREVIOUS_IMAGE"
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker pull "$PREVIOUS_IMAGE"
            docker stop unext-backend 2>/dev/null || true
            docker rm unext-backend 2>/dev/null || true
            docker run --restart unless-stopped -d --name unext-backend -p ${{ secrets.PORT }}:${{ secrets.PORT }} "$PREVIOUS_IMAGE"

            TIMEOUT=60
            START=$(date +%s)
            until curl -fs --max-time 5 "http://localhost:${{ secrets.PORT }}/health" > /dev/null; do
              ELAPSED=$(( $(date +%s) - START ))
              if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
                echo "Rolled back version did not become healthy within ${TIMEOUT}s"
                exit 1
              fi
              echo "Waiting for rolled back app... (${ELAPSED}s)"
              sleep 5
            done
            echo "Rollback to $PREVIOUS_IMAGE completed and healthy"

      - name: Clean up old images
        if: ${{ success() }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOSTNAME }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SECRET_SSH_KEY }}
          script: |
            docker container prune -f
            docker image prune -af
            docker builder prune -af

      - name: Revoke runner ip address
        if: ${{ always() && steps.whitelist-ip.conclusion == 'success' }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id $AWS_INSTANCE_SG_ID \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
