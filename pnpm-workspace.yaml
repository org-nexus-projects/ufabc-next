packages:
  - apps/*
  - packages/*
  - tools/*
engineStrict: true
strictPeerDependencies: false
dedupePeerDependents: false
publicHoistPattern:
  - fastify
  - '@fastify/*'
  - '!@fastify/sensible'
  - pino
  - pino-pretty
  - '@axiomhq/*'
allowBuilds:
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  protobufjs: true
  ssh2: true
  weak-napi: true
injectWorkspacePackages: true
packageExtensions:
  fastify-type-provider-zod@3.0.0:
    dependencies:
      "@fastify/error": ^4.2.0
overrides:
  "@smithy/types": 4.14.3
  "@smithy/core": 3.33.2
onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - msw
  - unrs-resolver
  - vue-demi
